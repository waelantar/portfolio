<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">PF-004 direction A: Signal Route</title>
  <desc id="desc">Dark orange and ink portfolio mood frame. Desktop hero shows Wael Antar, approved professional scope, three proof lanes, work and contact actions. A case-study sketch and an empty Systems Lab state sit below. A mobile hero appears at right. All UI is a design concept.</desc>
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M 28 0 L 0 0 0 28" fill="none" stroke="#22262d" stroke-width="1"/></pattern>
    <linearGradient id="orange" x1="0" x2="1"><stop stop-color="#ff7a33"/><stop offset="1" stop-color="#ffb36c"/></linearGradient>
    <linearGradient id="fade" x1="0" x2="1"><stop stop-color="#12161e"/><stop offset="1" stop-color="#0b0d11"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="12"/></filter>
    <style>
      text{font-family:Arial,Helvetica,sans-serif}
      .mono{font-family:Consolas,Monaco,monospace}
      .white{fill:#f7f5f0}
      .muted{fill:#b7bac1}
      .orange{fill:#ff8a42}
      .kicker{font-size:12px;font-weight:700;letter-spacing:2px}
      .small{font-size:15px}
    </style>
