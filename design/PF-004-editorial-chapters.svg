<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">PF-004 direction B: Editorial Chapters</title>
  <desc id="desc">Warm light editorial portfolio mood frame. Desktop and mobile heroes foreground Wael Antar, approved professional scope, released work and contact. A professional case-study sketch and an empty Systems Lab panel are shown below. All UI is a design concept.</desc>
  <defs>
    <pattern id="grain" width="44" height="44" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".8" fill="#c9c4bb"/></pattern>
    <style>
      text{font-family:Arial,Helvetica,sans-serif}
      .mono{font-family:Consolas,Monaco,monospace}
      .ink{fill:#17191f}
      .muted{fill:#555b62}
      .accent{fill:#b8400d}
      .kicker{font-size:12px;font-weight:700;letter-spacing:2px}
    </style>
  </defs>
  <rect width="1600" height="1000" fill="#ede9e1"/>
